log_exercise:
  name: Log exercise
  description: >-
    Manually log an exercise session. If no calorie value is provided, net
    calories are estimated from the activity's MET value (net METs = MET - 1)
    and your current weight.
  fields:
    activity_type:
      name: Activity type
      description: >-
        Activity name from the built-in MET table (e.g. walking_brisk_4mph,
        running_6mph, yoga, hiit_circuit), or any label when providing an
        explicit calorie value.
      required: true
      example: cycling_moderate_12mph
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Duration of the session in minutes.
      required: true
      example: 45
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: min
          mode: box
    distance:
      name: Distance (optional)
      description: >-
        Distance covered, in the same unit as your monthly cycling goal
        (miles or km). Counts toward monthly distance progress.
      required: false
      example: 8.5
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          mode: box
    calories:
      name: Calories (override)
      description: >-
        Optional gross calorie value from a device. When provided, the resting
        component for the duration is subtracted to get net calories instead
        of using the MET table.
      required: false
      example: 350
      selector:
        number:
          min: 0
          max: 5000
          unit_of_measurement: kcal
          mode: box

set_correction_factor:
  name: Set correction factor
  description: >-
    Update the exercise correction factor applied to device-reported calories.
    Consumer fitness devices may overestimate burn by 15-30%.
  fields:
    factor:
      name: Factor
      description: Correction factor between 0.50 and 1.00.
      required: true
      example: 0.85
      selector:
        number:
          min: 0.5
          max: 1.0
          step: 0.01
          mode: slider

log_weight:
  name: Log weight
  description: Manually log a weight measurement (when no smart scale is connected).
  fields:
    weight:
      name: Weight
      description: Weight value, interpreted in the unit below.
      required: true
      example: 180
      selector:
        number:
          min: 20
          max: 1200
          step: 0.1
          mode: box
    unit:
      name: Unit
      description: >-
        Unit of the weight value. Defaults to the display unit configured for
        the integration.
      required: false
      example: lb
      selector:
        select:
          options:
            - kg
            - lb

log_body_fat:
  name: Log body fat
  description: Manually log a body fat percentage.
  fields:
    body_fat_pct:
      name: Body fat
      description: Body fat percentage (1-60).
      required: true
      example: 22.5
      selector:
        number:
          min: 1
          max: 60
          step: 0.1
          unit_of_measurement: "%"
          mode: box

reset_daily:
  name: Reset daily totals
  description: >-
    Manually reset today's exercise sessions and daily totals. Weight and body
    composition data are kept.

log_food:
  name: Log food (fallback)
  description: >-
    Manually log a food entry. Intended as a fallback when the SparkyFitness
    instance is offline; manual entries are merged with synced entries.
  fields:
    food_name:
      name: Food name
      description: Label for the entry, shown in the food log attributes.
      required: true
      example: "Greek yogurt"
      selector:
        text:
    calories:
      name: Calories
      description: Energy content of the entry in kcal.
      required: true
      example: 150
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: kcal
          mode: box
    protein_g:
      name: Protein
      description: >-
        Protein in grams. Leave blank if unknown — missing macros are never
        assumed to be zero.
      required: false
      example: 15
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: g
          mode: box
    carbs_g:
      name: Carbohydrates
      description: Carbohydrate in grams. Leave blank if unknown.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: g
          mode: box
    fat_g:
      name: Fat
      description: Fat in grams. Leave blank if unknown.
      required: false
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: g
          mode: box
    fiber_g:
      name: Fiber
      description: Dietary fiber in grams. Leave blank if unknown.
      required: false
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: g
          mode: box
    meal:
      name: Meal
      description: Omit to infer from the time of day.
      required: false
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack

set_protein_target:
  name: Set protein target
  description: Update the protein target value (and optionally the basis).
  fields:
    value:
      name: Value
      description: g/kg for weight-based bases, grams for the absolute basis.
      required: true
      example: 1.6
      selector:
        number:
          min: 0.4
          max: 300
          step: 0.1
          mode: box
    basis:
      name: Basis
      description: >-
        Optionally switch the target basis at the same time. Omit to keep the
        currently configured basis.
      required: false
      selector:
        select:
          options:
            - total_body_weight
            - fat_free_mass
            - absolute_grams

set_deficit_target:
  name: Set deficit target
  description: Update the target daily deficit (0-1000 kcal).
  fields:
    kcal:
      name: Deficit
      description: >-
        Target daily deficit in kcal. Guidelines recommend 500-750 kcal/day
        for weight reduction.
      required: true
      example: 500
      selector:
        number:
          min: 0
          max: 1000
          step: 50
          unit_of_measurement: kcal
          mode: slider

sync_sparkyfitness_now:
  name: Sync SparkyFitness now
  description: Trigger an immediate poll of the SparkyFitness food diary.

clear_todays_food_log:
  name: Clear today's food log
  description: >-
    Remove today's manually logged food entries. Entries synced from
    SparkyFitness are not deleted upstream and will return on the next poll.
