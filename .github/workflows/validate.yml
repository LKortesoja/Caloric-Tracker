name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches breakage from new Home Assistant / HACS releases.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pulled separately and quietly: progress output would otherwise consume
      # the 10-annotations-per-step budget before the real error is emitted.
      - name: Pull hassfest image
        run: docker pull --quiet ghcr.io/home-assistant/hassfest

      - name: Run hassfest
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}://github/workspace" \
            ghcr.io/home-assistant/hassfest > hassfest.log 2>&1
          code=$?
          cat hassfest.log
          if [ "$code" -ne 0 ]; then
            # Re-emit the tail as annotations so failures are readable from the
            # checks API without downloading the raw log.
            grep -v '^\s*$' hassfest.log | tail -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$code"

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This domain is not in home-assistant/brands (that repo is for
          # integrations shipped with Home Assistant), so skip that check.
          ignore: brands

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff pyyaml
      - name: Lint (pyflakes-level)
        run: ruff check custom_components tests --select F,E9
      - name: Run tests
        run: pytest tests/ -v
