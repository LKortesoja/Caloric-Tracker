name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches breakage from new Home Assistant / HACS releases.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}://github/workspace" \
            ghcr.io/home-assistant/hassfest 2>&1 | tee hassfest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Re-emit output as annotations so failures are readable from the
            # checks API without downloading the raw log.
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done < hassfest.log
          fi
          exit "$code"

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This domain is not in home-assistant/brands (that repo is for
          # integrations shipped with Home Assistant), so skip that check.
          ignore: brands

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff pyyaml
      - name: Lint (pyflakes-level)
        run: ruff check custom_components tests --select F,E9
      - name: Run tests
        run: pytest tests/ -v
